<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">jev-pilot</title>
  <desc id="desc">Let Jev steer Claude Code: the right reasoning effort, subagent model and skill for every prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ff4f"/>
      <stop offset="1" stop-color="#7cf0c4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>

  <!-- effort ladder: low → max -->
  <g transform="translate(900 78)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9aa6c3">
      <text x="0" y="16">max</text>
      <text x="0" y="56">xhigh</text>
      <text x="0" y="96">high</text>
      <text x="0" y="136">medium</text>
      <text x="0" y="176">low</text>
    </g>
    <g>
      <rect x="80" y="4"   width="240" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="80" y="44"  width="240" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="80" y="84"  width="240" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="80" y="124" width="240" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="80" y="164" width="240" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="80" y="84"  width="168" height="16" rx="8" fill="url(#accent)"/>
      <circle cx="248" cy="92" r="11" fill="#d4ff4f"/>
      <circle cx="248" cy="92" r="20" fill="none" stroke="#d4ff4f" stroke-opacity="0.35" stroke-width="2"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="140" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">jev<tspan fill="url(#accent)">-pilot</tspan></text>
    <text x="74" y="190" font-size="26" fill="#c9d2ea">Let Jev steer Claude Code.</text>
    <text x="74" y="228" font-size="20" fill="#8d99b8">The right reasoning effort, subagent model and skill for every prompt.</text>
  </g>
</svg>
